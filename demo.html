<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Buchee Demo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="buchee-app-icon-192.png"><title>Buchee • Geliştirme Önizlemesi</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#141414;background:#f7f7f7}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer}header{height:64px;background:#fff;border-bottom:1px solid #e9e9e9;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1050px)/2));position:sticky;top:0;z-index:10}.brand{font-size:27px;font-weight:900;letter-spacing:-1.5px}.mode{font-size:11px;font-weight:700;border:1px solid #ddd;padding:7px 10px;border-radius:999px}main{max-width:1050px;margin:auto;display:grid;grid-template-columns:205px minmax(0,1fr) 200px;gap:20px;padding:20px}aside,.content{background:#fff;border:1px solid #e9e9e9;border-radius:16px}aside{padding:14px;height:max-content}aside button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:13px;font-weight:600}aside button.active{background:#f0f0f0}.content{min-height:70vh;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #eee}h1{font-size:20px;margin:0}h2{font-size:16px}.muted{color:#777;font-size:13px}.stories{display:flex;gap:15px;padding:18px;overflow:auto;border-bottom:1px solid #eee}.story{text-align:center;flex:0 0 72px;font-size:11px}.circle{width:62px;height:62px;border:2px solid #222;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;font-size:23px;background:#fafafa}.post{padding:20px;border-bottom:1px solid #ececec}.author{font-weight:750;margin-bottom:10px}.post p{line-height:1.55}.actions{display:flex;gap:18px;margin-top:16px}.actions button{border:0;background:none;font-size:19px}.composer{display:flex;gap:10px;padding:16px;border-bottom:1px solid #eee}.composer input{flex:1;min-width:0;padding:13px;border:1px solid #eee;border-radius:12px;background:#fafafa}.primary{background:#111;color:#fff;border:0;border-radius:11px;padding:11px 15px}.notice{padding:13px;background:#f5f5f5;border-radius:12px;font-size:12px;line-height:1.6}.video{height:calc(100dvh - 160px);min-height:440px;background:#151515;color:white;display:grid;place-items:center;position:relative}.video .caption{position:absolute;bottom:25px;left:20px}.item{padding:20px;border-bottom:1px solid #eee}.bottom{display:none}dialog{border:0;border-radius:18px;padding:24px;width:min(90vw,430px);box-shadow:0 20px 90px #0003}dialog::backdrop{background:#0008}textarea{width:100%;height:110px;resize:vertical;border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.ghost{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px}.pill{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:6px 10px;margin:4px;font-size:12px}
@media(max-width:800px){.video{height:calc(100dvh - 154px);min-height:0}.mode{font-size:10px}.mode button{font-size:10px}main{display:block;padding:0 0 100px}aside{display:none}.content{border:0;border-radius:0;min-height:calc(100dvh - 150px)}.bottom{display:flex;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px;background:#111;color:white;border-radius:999px;justify-content:space-around;padding:7px;z-index:20}.bottom button{border:0;background:none;color:white;font-size:22px;padding:9px 13px}.bottom button.active{background:#eee;color:#111;border-radius:999px}header{padding:0 18px}}
</style></head><body><header><div class="brand">buchee</div><span class="mode">● DEMO <button id="exit-demo" style="border:0;background:transparent;text-decoration:underline;font-weight:700;margin-left:5px">Çık</button></span></header><main><aside id="side"></aside><section class="content" id="content"></section><aside><h2>Demo ortamı</h2><p class="notice">Supabase bağlantısı yok. Gerçek hesaplara, hikâyelere veya mesajlara erişilmez. Bu ekran tasarım geliştirme ve örnek etkileşimler içindir.</p><p class="muted">Normal uygulama: <a href="index.html">Buchee'ye dön</a></p></aside></main><nav class="bottom" id="bottom"></nav><dialog id="compose"><h2>Örnek paylaşım oluştur</h2><p class="muted">Yalnızca bu tarayıcıda saklanır.</p><textarea id="draft" maxlength="1500" placeholder="Ne düşünüyorsun?"></textarea><div class="dialog-actions"><button class="ghost" id="cancel">Vazgeç</button><button class="primary" id="publish">Demo paylaş</button></div></dialog><script>
(()=>{'use strict';const tabs=[['home','⌂','Akış'],['explore','⌕','Keşfet'],['compose','＋','Oluştur'],['reels','▷','Reels'],['profile','♙','Profil']];const names=['Buchee Social','Buchee Kültür','Buchee Teknoloji','Buchee Yaşam','Buchee Spor','Buchee Girişim','Buchee Eğlence'];const samples=[['Buchee Social','Buchee geliştirme önizlemesine hoş geldin. Yeni özellikleri burada deneyebiliriz.'],['Buchee Kültür','Bugün okuduğun en iyi kitap hangisi?'],['Buchee Teknoloji','Sence geleceği hangi teknoloji değiştirecek?'],['Buchee Yaşam','Kendine ayırdığın küçük bir mola bile değerli.']];const key='buchee-preview-posts-v1';try{localStorage.setItem('buchee_dev_home_v1','1')}catch(_){};let posts=[];try{posts=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(posts))posts=[]}catch(_){}let tab='home';const $=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));$('exit-demo').onclick=()=>{try{localStorage.removeItem('buchee_dev_home_v1')}catch(_){}location.href='index.html?demo=0'};const save=()=>{try{localStorage.setItem(key,JSON.stringify(posts.slice(0,40)))}catch(_){}};function post(author,body,i){return '<article class="post"><div class="author">◯ '+escape(author)+' <span class="muted">· Demo</span></div><p>'+escape(body)+'</p><div class="actions"><button data-like="'+i+'" aria-label="Beğen">♡</button><button data-comment="'+i+'" aria-label="Yorum">♧</button><button data-save="'+i+'" aria-label="Kaydet">♧</button></div></article>'}function render(){const side=$('side'),bottom=$('bottom');side.innerHTML=tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'active':'')+'">'+t[1]+' &nbsp; '+t[2]+'</button>').join('');bottom.innerHTML=tabs.map(t=>'<button aria-label="'+t[2]+'" data-tab="'+t[0]+'" class="'+(tab===t[0]?'active':'')+'">'+t[1]+'</button>').join('');let out='';if(tab==='home'){out='<div class="stories">'+names.map((n,i)=>'<div class="story"><div class="circle">'+['✦','▤','⌘','☼','⚽','↗','☺'][i]+'</div>'+escape(n.replace('Buchee ',''))+'</div>').join('')+'</div><div class="composer"><input readonly placeholder="Bir şeyler paylaş…" data-open-compose><button class="primary" data-open-compose>Paylaş</button></div>'+posts.map((p,i)=>post('Demo Kullanıcı',p,i)).join('')+samples.map((p,i)=>post(p[0],p[1],i+posts.length)).join('')}else if(tab==='explore'){out='<div class="section-head"><h1>Keşfet</h1></div><div class="composer"><input placeholder="Ara (örnek)" aria-label="Ara"></div>'+samples.map((p,i)=>post(p[0],p[1],i)).join('')}else if(tab==='reels'){out='<div class="video"><div style="text-align:center"><div style="font-size:60px">▷</div><p>Reels tasarım önizlemesi</p><small>Gerçek video ve sunucu bağlantısı kullanılmıyor</small></div><div class="caption">Buchee · Örnek Reels</div></div>'}else if(tab==='profile'){out='<div class="item"><div class="circle" style="margin:0 0 14px">♙</div><h1>Demo Kullanıcı</h1><p class="muted">@buchee_demo · Yerel önizleme hesabı</p><span class="pill">'+posts.length+' gönderi</span><span class="pill">0 takipçi</span><span class="pill">0 takip</span></div><div class="section-head"><h2>Gönderiler</h2></div>'+ (posts.length?posts.map((p,i)=>post('Demo Kullanıcı',p,i)).join(''):'<div class="item muted">Henüz demo gönderi yok.</div>')}else{out='<div class="item">Demo ekranı</div>'}$('content').innerHTML=out}document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){if(t.dataset.tab==='compose'){$('compose').showModal();return}tab=t.dataset.tab;render();return}if(e.target.closest('[data-open-compose]')){$('compose').showModal();return}const l=e.target.closest('[data-like]');if(l){l.textContent=l.textContent==='♥'?'♡':'♥';return}if(e.target.closest('[data-comment]')){alert('Yorumlar demo modunda sunucuya gönderilmez.');return}const s=e.target.closest('[data-save]');if(s){s.textContent=s.textContent==='◆'?'♧':'◆'}});$('cancel').onclick=()=>$('compose').close();$('publish').onclick=()=>{const v=$('draft').value.trim();if(!v)return;$('draft').value='';posts.unshift(v);save();$('compose').close();tab='home';render()};render()})();
</script></body></html>
