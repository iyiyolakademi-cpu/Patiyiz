name: Unblock Patiyiz Pages (one-time)
on:
  push:
    paths:
      - .github/workflows/pages-unblock-20261101.yml
permissions:
  contents: read
  pages: write
jobs:
  release-stale-pages-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stuck Pages deployment for previous successful commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/6827cc3c09cafcb9a81369f6154051e61014fdd7/cancel"
          status=$(curl --silent --show-error --output /tmp/pages-cancel-response --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$url")
          if [ "$status" = "204" ]; then
            echo "Stale GitHub Pages deployment lock released."
          elif [ "$status" = "404" ]; then
            echo "Stale Pages deployment not found; no cancellation needed."
          else
            echo "::error::GitHub Pages cancellation endpoint returned HTTP $status"
            sed -E 's/[[:cntrl:]]/ /g' /tmp/pages-cancel-response | head -c 500
            exit 1
          fi
