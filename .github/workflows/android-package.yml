name: Patiyiz Android APK / AAB (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patiyiz-android-package
  cancel-in-progress: false

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets exist
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing Android signing secrets. Follow android/README.md before using this workflow."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate source and live HTTPS origin
        run: node android/check-readiness.mjs --online
      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli
      - name: Prepare signing key (ephemeral runner only)
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/patiyiz-upload.keystore
          test -s android/patiyiz-upload.keystore
      - name: Generate Android project and confirm Play API
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bubblewrap update --skipVersionUpgrade
          test -f app/build.gradle
          if ! grep -Eq 'targetSdkVersion[[:space:]]+36\b|targetSdk[[:space:]]+36\b' app/build.gradle; then
            echo "::error::Generated Android project must target API 36 or newer."
            exit 1
          fi
      - name: Build signed APK and AAB
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd android
          bubblewrap build --signingKeyPath="$PWD/patiyiz-upload.keystore" --signingKeyAlias="$ANDROID_KEY_ALIAS"
          test -s app-release-signed.apk
          test -s app-release-bundle.aab
      - name: Upload private workflow artifacts (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: patiyiz-android-signed
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral key
        if: always()
        shell: bash
        run: rm -f android/patiyiz-upload.keystore
