name: Patiyiz static quality
on:
  push:
    branches:
      - main
      - patiyiz-audit-fixes-20261031
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-static.mjs
