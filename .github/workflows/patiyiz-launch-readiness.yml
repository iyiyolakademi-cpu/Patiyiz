name: Patiyiz 1.0 manual release gate
on:
  workflow_dispatch:
jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if manual, technical or legal gates are incomplete
        run: node scripts/patiyiz-release-audit.mjs --require-ready
