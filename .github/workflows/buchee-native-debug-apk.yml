name: Buchee Social - React Native Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile-native/**"
      - ".github/workflows/buchee-native-debug-apk.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Install Expo packages
        working-directory: mobile-native
        run: npm install --no-audit --no-fund
      - name: Check native sources
        working-directory: mobile-native
        run: npm run check
      - name: Generate independent native Android project
        working-directory: mobile-native
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install
      - name: Assemble installable debug APK
        working-directory: mobile-native/android
        env:
          CI: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload QA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Buchee-Social-React-Native-Preview-Android-APK
          path: mobile-native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
