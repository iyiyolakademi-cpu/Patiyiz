name: Buchee - Unblock Stuck Pages Deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buchee-pages-unblock-20261103.yml'
permissions:
  contents: read
  pages: write
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel stale GitHub Pages deployment holding the publishing lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Cancelling the timed-out Pages deployment, not the live site"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/dbb02cb528380515e1dbb2f21d2b2a011ac78ed8/cancel"
          echo "Cancel request accepted"
