name: Buchee - Diagnose and Retry Stuck Pages Deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buchee-pages-unblock-20261103.yml'
permissions:
  contents: read
  pages: write
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose stuck deployment and request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOYMENT="repos/${GITHUB_REPOSITORY}/pages/deployments/dbb02cb528380515e1dbb2f21d2b2a011ac78ed8"
          echo "Stale Pages deployment status before:"
          gh api "$DEPLOYMENT" --jq '.status' || true
          echo "Request cancellation for timed-out deployment"
          gh api --method POST "$DEPLOYMENT/cancel"
          echo "Status after cancellation:"
          gh api "$DEPLOYMENT" --jq '.status' || true
          echo "Request Pages build of latest main revision"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
