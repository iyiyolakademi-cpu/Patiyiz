name: Buchee Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/mobile-stability-20261103
    paths:
      - .github/workflows/android-build.yml

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare current Buchee website
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {"name":"buchee-social-android","version":"1.0.0","private":true,"type":"module","dependencies":{"@capacitor/core":"7.4.4","@capacitor/android":"7.4.4"},"devDependencies":{"@capacitor/cli":"7.4.4"}}
          JSON
          npm install --no-audit --no-fund
          mkdir -p www
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=android --exclude=www --exclude=package.json --exclude=package-lock.json --exclude='*.apk' --exclude='*.aab' ./ www/
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.buchee.social","appName":"Buchee Social","webDir":"www","android":{"allowMixedContent":false}}
          JSON
          test -s www/index.html
          npx cap add android
          npx cap sync android
      - name: Build installable test APK and test AAB
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BucheeSocial-Android-test-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BucheeSocial-Android-test-AAB
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14
