name: Refresh Patiyiz Pages configuration
on:
  push:
    paths:
      - '.github/workflows/pages-source-refresh-20261101.yml'
permissions:
  contents: read
  pages: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request non-destructive update of existing Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages-setting-response -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Non-destructive existing-source update returned HTTP $status"
          if [[ "$status" != "204" ]]; then
            cat /tmp/pages-setting-response | head -c 1000
            exit 1
          fi
          echo "Pages configuration re-saved successfully."
