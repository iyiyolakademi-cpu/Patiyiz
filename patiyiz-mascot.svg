 <path d="M102 143q17-14 34 0-3 13-17 13-15 0-17-13z" fill="#26272b"/>
 <path d="M120 157v7m-17-2q17 16 34 0" stroke="#26272b" stroke-width="4" fill="none" stroke-linecap="round"/>
