<g class="wave"><path d="M159 171q28-12 35 7 4 14-10 24-17 10-27-3z" fill="#fff" stroke="#26272b" stroke-width="7"/><path d="M169 187l-1 6m10-7v7m9-6l-1 6" stroke="#26272b" stroke-width="3" stroke-linecap="round"/></g>
<path d="M88 193q-15 22-28 15" fill="none" stroke="#242428" stroke-width="11" stroke-linecap="round"/>
<g class="head">
 <path d="M77 78Q35 57 42 116q4 20 20 19" fill="#25262b" stroke="#25262b" stroke-width="8" stroke-linejoin="round"/>
 <path d="M155 78q42-23 36 39-3 20-20 19" fill="#25262b" stroke="#25262b" stroke-width="8" stroke-linejoin="round"/>
 <path d="M58 107q1-62 61-64 64 0 64 66v23q-5 40-63 42-59 0-63-46z" fill="#fff" stroke="#232428" stroke-width="8"/>
