<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">Patiyiz'in sevimli patili maskotu</title>
<desc id="desc">Göz kırpan, kuyruğunu ve patisini hareket ettiren siyah beyaz sevimli köpek</desc>
<style>
 .tail{transform-origin:184px 174px;animation:wag 1.7s ease-in-out infinite}
 .wave{transform-origin:158px 160px;animation:wave 3.8s ease-in-out infinite}
 .head{transform-origin:117px 103px;animation:tilt 5.5s ease-in-out infinite}
 .eyes{transform-origin:center;transform-box:fill-box;animation:blink 5.8s infinite}
 @keyframes wag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(17deg)}}
 @keyframes wave{0%,68%,100%{transform:rotate(0)}75%,86%{transform:rotate(-23deg)}81%,92%{transform:rotate(8deg)}}
 @keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.10)}}
 @media(prefers-reduced-motion:reduce){.tail,.wave,.head,.eyes{animation:none!important}}
</style>
<ellipse cx="120" cy="218" rx="82" ry="10" fill="#141414" opacity=".09"/>
