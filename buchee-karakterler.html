<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchee Karakterleri</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#19212d}main{max-width:650px;margin:auto;padding:18px}header{display:flex;gap:12px;align-items:center}a{color:#5d45bc}article{background:white;border:1px solid #e4e5ec;border-radius:16px;padding:16px;margin:14px 0}small{color:#68758a}.face{width:40px;height:40px;background:#ece7ff;border-radius:50%;display:grid;place-items:center;font-weight:bold;color:#5c42b8}.person{display:flex;gap:10px;align-items:center}p{white-space:pre-wrap;line-height:1.55}</style></head><body><main><header><a href="./">← Geri</a><h2>Buchee Karakterleri</h2></header><small>Bu alandaki profiller Buchee tarafından yönetilen kurgusal karakterlerdir; gerçek kullanıcı değildir.</small><div id="feed">Paylaşımlar yükleniyor…</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.2';const db=createClient('https://tqnvvrgrsxrvzxbjbsgl.supabase.co','sb_publishable_94x0ozPL38-3HJer2l5tqQ_BrpQZYH-');const el=document.getElementById('feed');const{data:profiles,error:pe}=await db.from('buchee_demo_profiles').select('id,display_name,handle,bio');const{data:posts,error:po}=await db.from('buchee_character_posts').select('character_id,body,created_at').eq('is_published',true).order('created_at',{ascending:false}).limit(100);el.replaceChildren();if(pe||po){el.textContent='İçerikler yüklenemedi.'}else if(!posts.length){el.textContent='Henüz karakter paylaşımı yok.'}else{let lookup=new Map(profiles.map(p=>[p.id,p]));for(const post of posts){const p=lookup.get(post.character_id);if(!p)continue;const item=document.createElement('article'),person=document.createElement('div');person.className='person';const face=document.createElement('div');face.className='face';face.textContent=p.display_name.slice(0,1);const t=document.createElement('div');const title=document.createElement('b');title.textContent=p.display_name;const sub=document.createElement('small');sub.textContent=' @'+p.handle+' · Buchee Karakteri';t.append(title,document.createElement('br'),sub);person.append(face,t);const body=document.createElement('p');body.textContent=post.body;const time=document.createElement('small');time.textContent=new Date(post.created_at).toLocaleString('tr-TR');item.append(person,body,time);el.append(item)}}</script></body></html>
